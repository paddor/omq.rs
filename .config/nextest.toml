[profile.default]
slow-timeout = { period = "60s", terminate-after = 3, grace-period = "10s" }

[profile.ci]
inherits = "default"
fail-fast = false
failure-output = "immediate-final"
status-level = "slow"
final-status-level = "slow"

[profile.extended]
inherits = "ci"
# Extended CI wraps test runs with scripts/ci-run-with-forensics.sh at 10200s.
# Keep nextest above that so the wrapper owns real hang diagnostics.
slow-timeout = { period = "30m", terminate-after = 6, grace-period = "10s" }

[[profile.ci.overrides]]
filter = 'package(omq-tokio) and binary(omq_zstd_tcp) and test(/pub_sub_zstd_io_lane_(send|try_send)_auto_train_dict_for_late_subscriber/)'
threads-required = "num-test-threads"
