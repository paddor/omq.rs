[profile.default]
slow-timeout = { period = "60s", terminate-after = 3, grace-period = "10s" }

[profile.ci]
inherits = "default"
fail-fast = false
failure-output = "immediate-final"
status-level = "slow"
final-status-level = "slow"

[profile.extended]
inherits = "ci"
slow-timeout = { period = "10m", terminate-after = 3, grace-period = "10s" }

[profile.default-miri]
slow-timeout = { period = "120s", terminate-after = 3, grace-period = "10s" }
fail-fast = false
failure-output = "immediate-final"
status-level = "slow"
final-status-level = "slow"

[profile.extended-miri]
inherits = "default-miri"
slow-timeout = { period = "10m", terminate-after = 1, grace-period = "10s" }
