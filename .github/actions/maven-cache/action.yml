name: Maven cache
description: >
  Cache ~/.m2/repository per runner OS, Maven version, and job. Maven
  distrusts artifacts that another Maven version recorded under a different
  repository key and re-checks each one against Maven Central.
runs:
  using: composite
  steps:
    - id: maven
      shell: bash
      run: echo "version=$(mvn -B -v | sed -n 's/^Apache Maven \([^ ]*\).*/\1/p')" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: maven-${{ runner.os }}-${{ steps.maven.outputs.version }}-${{ github.job }}-${{ hashFiles('bindings/java/pom.xml') }}
        restore-keys: |
          maven-${{ runner.os }}-${{ steps.maven.outputs.version }}-${{ github.job }}-
          maven-${{ runner.os }}-${{ steps.maven.outputs.version }}-
