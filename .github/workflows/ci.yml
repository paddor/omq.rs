name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      test_matrix: ${{ steps.matrix.outputs.test_matrix }}
      os_matrix: ${{ steps.matrix.outputs.os_matrix }}
      lint_matrix: ${{ steps.matrix.outputs.lint_matrix }}
      run_pyomq: ${{ steps.scope.outputs.pyomq }}
      run_java: ${{ steps.scope.outputs.java }}
      run_go: ${{ steps.scope.outputs.go }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!**/*.svg'
              - '!doc/**'
      - uses: dorny/paths-filter@v3
        id: scope
        with:
          filters: |
            pyomq:
              - 'bindings/pyomq/**'
              - 'omq-proto/**'
              - 'omq-tokio/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - '.config/nextest.toml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release-pyomq.yml'
            java:
              - 'bindings/java/**'
              - '.github/workflows/ci.yml'
            go:
              - 'bindings/go/**'
              - 'omq-proto/**'
              - 'omq-tokio/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - '.github/workflows/ci.yml'
      - id: matrix
        run: |
          echo 'test_matrix={"include":[{"toolchain":"1.93","os":"ubuntu-latest"},{"toolchain":"stable","os":"macos-15"},{"toolchain":"stable","os":"windows-latest","target":"x86_64-pc-windows-msvc"}]}' >> "$GITHUB_OUTPUT"
          echo 'os_matrix={"os":["ubuntu-latest","macos-15","windows-latest"]}' >> "$GITHUB_OUTPUT"
          if [[ "${{ steps.scope.outputs.pyomq }}" == "true" ]]; then
            echo 'lint_matrix={"include":[{"name":"Linux","kind":"rust","os":"ubuntu-latest"},{"name":"macOS Intel","kind":"rust","os":"macos-15-intel"},{"name":"macOS ARM64","kind":"rust","os":"macos-15"},{"name":"Windows","kind":"rust","os":"windows-latest"},{"name":"pyomq","kind":"pyomq","os":"ubuntu-latest"}]}' >> "$GITHUB_OUTPUT"
          else
            echo 'lint_matrix={"include":[{"name":"Linux","kind":"rust","os":"ubuntu-latest"},{"name":"macOS Intel","kind":"rust","os":"macos-15-intel"},{"name":"macOS ARM64","kind":"rust","os":"macos-15"},{"name":"Windows","kind":"rust","os":"windows-latest"}]}' >> "$GITHUB_OUTPUT"
          fi

  go-fmt:
    name: go fmt
    needs: [changes]
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.run_go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache-dependency-path: bindings/go/go.mod
      - name: gofmt
        working-directory: bindings/go
        run: |
          files="$(gofmt -l .)"
          if [[ -n "$files" ]]; then
            printf '%s\n' "$files"
            exit 1
          fi

  go-test:
    name: go test
    needs: [changes, go-fmt]
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.run_go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/go/native
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache-dependency-path: bindings/go/go.mod
      - name: build native
        run: cargo build --release --manifest-path bindings/go/native/Cargo.toml
      - name: go vet
        working-directory: bindings/go
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/bindings/go/native/target/release:${{ github.workspace }}/bindings/go/native/target/debug
        run: go vet ./...
      - name: go test
        working-directory: bindings/go
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/bindings/go/native/target/release:${{ github.workspace }}/bindings/go/native/target/debug
        run: go test -count=1 ./...

  linux-gate:
    name: linux gate
    needs: [changes, lint]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: cargo nextest
        run: cargo nextest run --profile ci --workspace

  test:
    name: cargo nextest (${{ matrix.toolchain }}, ${{ matrix.os }})
    needs: [changes, linux-gate]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.test_matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          targets: ${{ matrix.target || '' }}
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: cargo nextest
        if: runner.os != 'macOS'
        run: cargo nextest run --profile ci --workspace
      - name: cargo nextest (macOS)
        if: runner.os == 'macOS'
        run: cargo nextest run --profile ci --workspace --test-threads=1

  encryption:
    name: encryption (curve, ${{ matrix.os }})
    needs: [changes, linux-gate]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.os_matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: cargo nextest (curve)
        if: runner.os != 'macOS'
        run: cargo nextest run --profile ci -p omq-tokio --features curve
      - name: cargo nextest (curve, macOS)
        if: runner.os == 'macOS'
        run: cargo nextest run --profile ci -p omq-tokio --features curve --test-threads=1

  compression:
    name: compression (${{ matrix.os }})
    needs: [changes, linux-gate]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.os_matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: cargo nextest (lz4)
        if: runner.os != 'macOS'
        run: cargo nextest run --profile ci -p omq-tokio --features lz4
      - name: cargo nextest (lz4, macOS)
        if: runner.os == 'macOS'
        run: cargo nextest run --profile ci -p omq-tokio --features lz4 --test-threads=1
      - name: cargo nextest (zstd)
        if: runner.os != 'macOS'
        run: cargo nextest run --profile ci -p omq-tokio --features zstd
      - name: cargo nextest (zstd, macOS)
        if: runner.os == 'macOS'
        run: cargo nextest run --profile ci -p omq-tokio --features zstd --test-threads=1
      - name: cargo nextest (lz4+ws endpoint)
        run: cargo nextest run --profile ci -p omq-proto --features "lz4 ws" --test omq_proto_endpoint
      - name: cargo nextest (lz4+ws)
        if: runner.os != 'macOS'
        run: cargo nextest run --profile ci -p omq-tokio --features "lz4 ws" --test omq_lz4_ws
      - name: cargo nextest (lz4+ws, macOS)
        if: runner.os == 'macOS'
        run: cargo nextest run --profile ci -p omq-tokio --features "lz4 ws" --test omq_lz4_ws --test-threads=1

  interop:
    name: interop (pyzmq)
    needs: [changes, linux-gate]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # pyzmq wheels bundle libzmq + libsodium: the peer is the real
    # reference implementation.
    env:
      OMQ_INTEROP_REQUIRED: "1" # missing peer fails instead of skipping
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: actions/setup-python@v6
        id: python
        with: { python-version: "3.14" }
      - name: install pyzmq
        run: python -m pip install --upgrade pip "pyzmq>=25"
      - name: report peer versions
        run: python -c "import zmq; print('pyzmq', zmq.__version__, 'libzmq', zmq.zmq_version(), 'curve', zmq.has('curve'))"
      - name: interop (NULL + STREAM)
        env:
          OMQ_PYTHON3: ${{ steps.python.outputs.python-path }}
        run: cargo nextest run --profile ci -p omq-tokio --test omq_interop_pyzmq_null
      - name: interop (PLAIN)
        env:
          OMQ_PYTHON3: ${{ steps.python.outputs.python-path }}
        run: cargo nextest run --profile ci -p omq-tokio --features plain --test omq_interop_pyzmq_plain
      - name: interop (CURVE)
        env:
          OMQ_PYTHON3: ${{ steps.python.outputs.python-path }}
        run: cargo nextest run --profile ci -p omq-tokio --features curve --test omq_interop_pyzmq_curve

  cppzmq:
    name: cppzmq (${{ matrix.header }})
    needs: [changes, linux-gate]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        header: [distro, upstream]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install cppzmq
        if: matrix.header == 'distro'
        run: |
          sudo apt-get update
          sudo apt-get install -y cppzmq-dev
      - name: checkout upstream cppzmq
        if: matrix.header == 'upstream'
        run: git clone --depth 1 https://github.com/zeromq/cppzmq /tmp/cppzmq
      - name: cppzmq tests (distro)
        if: matrix.header == 'distro'
        run: ./scripts/test-cppzmq.sh
      - name: cppzmq examples (distro)
        if: matrix.header == 'distro'
        run: ./scripts/test-cppzmq-examples.sh
      - name: cppzmq tests (upstream)
        if: matrix.header == 'upstream'
        env:
          CPPZMQ_CFLAGS: -I/tmp/cppzmq
        run: ./scripts/test-cppzmq.sh
      - name: cppzmq examples (upstream)
        if: matrix.header == 'upstream'
        env:
          CPPZMQ_CFLAGS: -I/tmp/cppzmq
        run: ./scripts/test-cppzmq-examples.sh

  libzmq-packaging:
    name: libzmq packaging
    needs: [changes, linux-gate]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: package smoke
        run: ./scripts/test-libzmq-packaging.sh

  loom:
    name: loom (yring)
    needs: [changes, linux-gate]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # omq-tokio's loom_signal test needs no cfg and runs in `test`.
    # RUSTFLAGS replaces the workflow-level value, so repeat -D warnings.
    env:
      RUSTFLAGS: --cfg loom -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: loom model check
        run: cargo nextest run --profile ci -p yring --features async --test loom --release

  miri:
    name: miri (yring)
    needs: [changes, linux-gate]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # yring holds the only Miri-checkable unsafe: omq-proto is
    # forbid(unsafe_code) and omq-tokio's tests are real socket I/O.
    # No -D warnings: nightly adds lints on its own schedule.
    env:
      RUSTFLAGS: ""
      MIRIFLAGS: -Zmiri-disable-isolation
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly # falls back if nightly lacks miri
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo miri setup
      - name: miri test
        run: cargo miri nextest run -p yring --features async

  fuzz-smoke:
    name: fuzz smoke
    needs: [changes, linux-gate]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # OMQ_FUZZ_ITERS means something different per target, so the two
    # get separate budgets: a parser iteration is a buffer parse, a
    # socket-action iteration drives a live socket (~90ms). The
    # `extended` workflow runs both far deeper.
    # nextest prints captured output on failure, including OMQ_FUZZ_SEED.
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: fuzz parsers
        env:
          OMQ_FUZZ_ITERS: "1000000"
        run: >
          cargo nextest run --profile ci -p omq-tokio
          --features "fuzz plain curve lz4 zstd ws" --release
          --test omq_fuzz_parsers
      - name: fuzz socket actions
        env:
          OMQ_FUZZ_ITERS: "200"
        run: >
          cargo nextest run --profile ci -p omq-tokio
          --features "fuzz plain curve lz4 zstd ws" --release
          --test omq_fuzz_socket_actions

  linux-32bit:
    name: 32-bit linux (${{ matrix.target }})
    needs: [changes, linux-gate]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target:
          - i686-unknown-linux-gnu
          - armv7-unknown-linux-gnueabihf
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93"
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - uses: Swatinem/rust-cache@v2
      - name: compile workspace
        run: |
          if [[ "${{ matrix.target }}" == "armv7-unknown-linux-gnueabihf" ]]; then
            # `ws` pulls in `ring`, whose debug C build passes an x86-only
            # frame-pointer flag through this armv7 cross compiler. i686
            # still covers 32-bit `--all-targets --all-features`.
            features=(
              omq-proto/plain
              omq-proto/curve
              omq-proto/lz4
              omq-proto/zstd
              omq-tokio/plain
              omq-tokio/curve
              omq-tokio/lz4
              omq-tokio/zstd
            )
            cross check --target ${{ matrix.target }} \
              -p yring -p omq-proto -p omq-tokio -p omq-libzmq \
              --features "${features[*]}" \
              --lib --bins
          else
            cross check --target ${{ matrix.target }} --workspace --all-targets --all-features
          fi
      - name: yring tests
        run: bash scripts/ci-cross-test-timeout.sh ${{ matrix.target }} -p yring --all-features
      - name: tokio tcp smoke tests
        if: matrix.target != 'armv7-unknown-linux-gnueabihf'
        run: bash scripts/ci-cross-test-timeout.sh ${{ matrix.target }} -p omq-tokio --test omq_tcp_smoke
      - name: proto lz4 tests
        run: bash scripts/ci-cross-test-timeout.sh ${{ matrix.target }} -p omq-proto --features lz4 --lib
      - name: libzmq ABI and inproc tests
        run: |
          bash scripts/ci-cross-test-timeout.sh ${{ matrix.target }} -p omq-libzmq --test omq_libzmq_ctx
          bash scripts/ci-cross-test-timeout.sh ${{ matrix.target }} -p omq-libzmq --test omq_libzmq_multipart
          bash scripts/ci-cross-test-timeout.sh ${{ matrix.target }} -p omq-libzmq --test omq_libzmq_proxy
          bash scripts/ci-cross-test-timeout.sh ${{ matrix.target }} -p omq-libzmq --test omq_libzmq_draft

  lint:
    name: fmt + clippy (${{ matrix.name }})
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.lint_matrix) }}
    steps:
      - uses: actions/checkout@v7
      - name: install Rust (fmt/clippy)
        if: matrix.kind == 'rust'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: install Rust (pyomq)
        if: matrix.kind == 'pyomq'
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        if: matrix.kind == 'rust'
        run: cargo fmt --all --check
      - name: clippy (Linux)
        if: matrix.kind == 'rust' && runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets --all-features
      - name: clippy (Windows)
        if: matrix.kind == 'rust' && runner.os == 'Windows'
        run: cargo clippy --workspace --all-targets --all-features
      - name: clippy (macOS)
        if: matrix.kind == 'rust' && runner.os == 'macOS'
        run: cargo clippy --workspace --all-targets --all-features
      - uses: actions/setup-python@v7
        if: matrix.kind == 'pyomq' && needs.changes.outputs.run_pyomq == 'true'
        with:
          python-version: "3.14"
      - name: create virtualenv and install python deps
        if: matrix.kind == 'pyomq' && needs.changes.outputs.run_pyomq == 'true'
        working-directory: bindings/pyomq
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install --group test --group dev
      - name: build pyomq
        if: matrix.kind == 'pyomq' && needs.changes.outputs.run_pyomq == 'true'
        working-directory: bindings/pyomq
        run: .venv/bin/pip install .
      - name: formatting
        if: matrix.kind == 'pyomq' && needs.changes.outputs.run_pyomq == 'true'
        working-directory: bindings/pyomq
        run: .venv/bin/ruff format .
      - name: linting
        if: matrix.kind == 'pyomq' && needs.changes.outputs.run_pyomq == 'true'
        working-directory: bindings/pyomq
        run: .venv/bin/ruff check .
      - name: type check
        if: matrix.kind == 'pyomq' && needs.changes.outputs.run_pyomq == 'true'
        working-directory: bindings/pyomq
        run: |
          .venv/bin/ty check . --python-platform linux
          .venv/bin/ty check . --python-platform win32

  pyomq-test:
    name: pyomq-test
    needs: [changes, linux-gate]
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.run_pyomq == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - python-version: "3.11"
            os: ubuntu-latest
          - python-version: "3.14"
            os: ubuntu-latest
          - python-version: "3.14"
            os: windows-latest
          - python-version: "3.14"
            os: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: create virtualenv and install python deps
        working-directory: bindings/pyomq
        run: |
          pip install --upgrade pip
          pip install --group test --group dev
      - name: build pyomq
        working-directory: bindings/pyomq
        run: pip install .
      - name: cargo nextest
        working-directory: bindings/pyomq
        run: cargo nextest run --profile ci --config-file .config/nextest.toml
      - name: pytest
        working-directory: bindings/pyomq
        run: pytest -v -k "not test_perf" -W error

  java-lint:
    name: java-lint
    needs: [changes]
    if: needs.changes.outputs.run_java == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: bindings/java/pom.xml
      - name: format, lint, compile, javadoc
        run: >
          mvn -f bindings/java/pom.xml -DskipNative=true -DskipTests
          spotless:check checkstyle:check compile test-compile javadoc:javadoc

  java-test:
    name: java-test (${{ matrix.os }})
    needs: [changes, java-lint]
    if: needs.changes.outputs.run_java == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/java/native
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: bindings/java/pom.xml
      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: "3.14"
      - name: install pyzmq
        run: python -m pip install --upgrade pip "pyzmq>=25"
      - name: junit
        env:
          OMQ_INTEROP_REQUIRED: "1"
          OMQ_PYTHON3: ${{ steps.python.outputs.python-path }}
        run: mvn -f bindings/java/pom.xml test

  ci-success:
    name: CI success
    needs:
      [
        changes,
        linux-gate,
        test,
        encryption,
        compression,
        interop,
        cppzmq,
        loom,
        miri,
        fuzz-smoke,
        linux-32bit,
        lint,
        pyomq-test,
        java-lint,
        java-test,
        go-fmt,
        go-test,
      ]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: check all jobs passed or were skipped
        run: |
          if [[ '${{ toJSON(needs.*.result) }}' =~ (failure|cancelled) ]]; then
            exit 1
          fi
