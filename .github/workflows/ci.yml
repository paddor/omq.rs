name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      test_matrix: ${{ steps.matrix.outputs.test_matrix }}
      os_matrix: ${{ steps.matrix.outputs.os_matrix }}
      lint_matrix: ${{ steps.matrix.outputs.lint_matrix }}
      run_pyomq: ${{ steps.matrix.outputs.run_pyomq }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!**/*.svg'
              - '!doc/**'
      - id: matrix
        run: |
          echo 'test_matrix={"include":[{"toolchain":"stable","os":"ubuntu-latest"},{"toolchain":"stable","os":"ubuntu-24.04-arm"},{"toolchain":"stable","os":"macos-15-intel"},{"toolchain":"stable","os":"macos-15"},{"toolchain":"1.93","os":"ubuntu-latest"},{"toolchain":"stable","os":"windows-latest","target":"x86_64-pc-windows-msvc"}]}' >> "$GITHUB_OUTPUT"
          echo 'os_matrix={"os":["ubuntu-latest","macos-15-intel","macos-15","windows-latest"]}' >> "$GITHUB_OUTPUT"
          echo 'lint_matrix={"include":[{"name":"Linux","kind":"rust","os":"ubuntu-latest"},{"name":"macOS Intel","kind":"rust","os":"macos-15-intel"},{"name":"macOS ARM64","kind":"rust","os":"macos-15"},{"name":"Windows","kind":"rust","os":"windows-latest"},{"name":"pyomq","kind":"pyomq","os":"ubuntu-latest"}]}' >> "$GITHUB_OUTPUT"
          echo 'run_pyomq=true' >> "$GITHUB_OUTPUT"

  test:
    name: cargo test (${{ matrix.toolchain }}, ${{ matrix.os }})
    needs: [changes, lint]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.test_matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          targets: ${{ matrix.target || '' }}
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        if: runner.os != 'macOS'
        run: cargo test --workspace --no-fail-fast
      - name: cargo test (macOS)
        if: runner.os == 'macOS'
        run: cargo test --workspace --no-fail-fast -- --test-threads=1

  encryption:
    name: encryption (curve, ${{ matrix.os }})
    needs: [changes, lint]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.os_matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test (curve)
        if: runner.os != 'macOS'
        run: cargo test -p omq-tokio --features curve
      - name: cargo test (curve, macOS)
        if: runner.os == 'macOS'
        run: cargo test -p omq-tokio --features curve -- --test-threads=1

  compression:
    name: compression (${{ matrix.os }})
    needs: [changes, lint]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.os_matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test (lz4)
        if: runner.os != 'macOS'
        run: cargo test -p omq-tokio --features lz4
      - name: cargo test (lz4, macOS)
        if: runner.os == 'macOS'
        run: cargo test -p omq-tokio --features lz4 -- --test-threads=1

  interop:
    name: interop (pyzmq)
    needs: [changes, lint]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # pyzmq wheels bundle libzmq + libsodium: the peer is the real
    # reference implementation.
    env:
      OMQ_INTEROP_REQUIRED: "1" # missing peer fails instead of skipping
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        id: python
        with: { python-version: "3.14" }
      - name: install pyzmq
        run: python -m pip install --upgrade pip "pyzmq>=25"
      - name: report peer versions
        run: python -c "import zmq; print('pyzmq', zmq.__version__, 'libzmq', zmq.zmq_version(), 'curve', zmq.has('curve'))"
      - name: interop (PLAIN)
        env:
          OMQ_PYTHON3: ${{ steps.python.outputs.python-path }}
        run: cargo test -p omq-tokio --features plain --test omq_interop_pyzmq_plain
      - name: interop (CURVE)
        env:
          OMQ_PYTHON3: ${{ steps.python.outputs.python-path }}
        run: cargo test -p omq-tokio --features curve --test omq_interop_pyzmq_curve

  loom:
    name: loom (yring)
    needs: [changes, lint]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # omq-tokio's loom_signal test needs no cfg and runs in `test`.
    # RUSTFLAGS replaces the workflow-level value, so repeat -D warnings.
    env:
      RUSTFLAGS: --cfg loom -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: loom model check
        run: cargo test -p yring --features async --test loom --release

  miri:
    name: miri (yring)
    needs: [changes, lint]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # yring holds the only Miri-checkable unsafe: omq-proto is
    # forbid(unsafe_code) and omq-tokio's tests are real socket I/O.
    # No -D warnings: nightly adds lints on its own schedule.
    env:
      RUSTFLAGS: ""
      MIRIFLAGS: -Zmiri-disable-isolation
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly # falls back if nightly lacks miri
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - run: cargo miri setup
      - name: miri test
        run: cargo miri test -p yring --features async

  fuzz-smoke:
    name: fuzz smoke
    needs: [changes, lint]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # OMQ_FUZZ_ITERS means something different per target, so the two
    # get separate budgets: a parser iteration is a buffer parse, a
    # socket-action iteration drives a live socket (~90ms). The
    # `extended` workflow runs both far deeper.
    # --nocapture surfaces OMQ_FUZZ_SEED for reproduction.
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: fuzz parsers
        env:
          OMQ_FUZZ_ITERS: "1000000"
        run: >
          cargo test -p omq-tokio --features "fuzz plain curve lz4 ws" --release
          --test omq_fuzz_parsers -- --nocapture
      - name: fuzz socket actions
        env:
          OMQ_FUZZ_ITERS: "200"
        run: >
          cargo test -p omq-tokio --features "fuzz plain curve lz4 ws" --release
          --test omq_fuzz_socket_actions -- --nocapture

  linux-32bit:
    name: 32-bit linux (${{ matrix.target }})
    needs: [changes, lint]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - i686-unknown-linux-gnu
          - armv7-unknown-linux-gnueabihf
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93"
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - uses: Swatinem/rust-cache@v2
      - name: compile workspace
        run: cross check --target ${{ matrix.target }} --workspace --all-targets --all-features
      - name: yring tests
        run: cross test --target ${{ matrix.target }} -p yring --all-features
      - name: tokio tcp smoke tests
        run: cross test --target ${{ matrix.target }} -p omq-tokio --test omq_tcp_smoke
      - name: proto lz4 tests
        run: cross test --target ${{ matrix.target }} -p omq-proto --features lz4 --lib
      - name: libzmq ABI and inproc tests
        run: |
          cross test --target ${{ matrix.target }} -p omq-libzmq --test omq_libzmq_ctx
          cross test --target ${{ matrix.target }} -p omq-libzmq --test omq_libzmq_multipart
          cross test --target ${{ matrix.target }} -p omq-libzmq --test omq_libzmq_proxy
          cross test --target ${{ matrix.target }} -p omq-libzmq --test omq_libzmq_draft

  lint:
    name: fmt + clippy (${{ matrix.name }})
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.lint_matrix) }}
    steps:
      - uses: actions/checkout@v7
      - name: install Rust (fmt/clippy)
        if: matrix.kind == 'rust'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: install Rust (pyomq)
        if: matrix.kind == 'pyomq'
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        if: matrix.kind == 'rust'
        run: cargo fmt --all --check
      - name: clippy (Linux)
        if: matrix.kind == 'rust' && runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets --all-features
      - name: clippy (Windows)
        if: matrix.kind == 'rust' && runner.os == 'Windows'
        run: cargo clippy --workspace --all-targets --all-features
      - name: clippy (macOS)
        if: matrix.kind == 'rust' && runner.os == 'macOS'
        run: cargo clippy --workspace --all-targets --all-features
      - uses: actions/setup-python@v7
        if: matrix.kind == 'pyomq' && needs.changes.outputs.run_pyomq == 'true'
        with:
          python-version: "3.14"
      - name: create virtualenv and install python deps
        if: matrix.kind == 'pyomq' && needs.changes.outputs.run_pyomq == 'true'
        working-directory: bindings/pyomq
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install --group test --group dev
      - name: build pyomq
        if: matrix.kind == 'pyomq' && needs.changes.outputs.run_pyomq == 'true'
        working-directory: bindings/pyomq
        run: .venv/bin/pip install .
      - name: formatting
        if: matrix.kind == 'pyomq' && needs.changes.outputs.run_pyomq == 'true'
        working-directory: bindings/pyomq
        run: .venv/bin/ruff format .
      - name: linting
        if: matrix.kind == 'pyomq' && needs.changes.outputs.run_pyomq == 'true'
        working-directory: bindings/pyomq
        run: .venv/bin/ruff check .
      - name: type check
        if: matrix.kind == 'pyomq' && needs.changes.outputs.run_pyomq == 'true'
        working-directory: bindings/pyomq
        run: |
          .venv/bin/ty check . --python-platform linux
          .venv/bin/ty check . --python-platform win32

  pyomq-test:
    name: pyomq-test
    needs: [changes, lint]
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.run_pyomq == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - python-version: "3.11"
            os: ubuntu-latest
          - python-version: "3.14"
            os: ubuntu-latest
          - python-version: "3.14"
            os: windows-latest
          - python-version: "3.14"
            os: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: create virtualenv and install python deps
        working-directory: bindings/pyomq
        run: |
          pip install --upgrade pip
          pip install --group test --group dev
      - name: build pyomq
        working-directory: bindings/pyomq
        run: pip install .
      - name: cargo test
        working-directory: bindings/pyomq
        run: cargo test
      - name: pytest
        working-directory: bindings/pyomq
        run: pytest -v -k "not test_perf" -W error

  ci-success:
    name: CI success
    needs:
      [
        changes,
        test,
        encryption,
        compression,
        interop,
        loom,
        miri,
        fuzz-smoke,
        linux-32bit,
        lint,
        pyomq-test,
      ]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: check all jobs passed or were skipped
        run: |
          if [[ '${{ toJSON(needs.*.result) }}' =~ (failure|cancelled) ]]; then
            exit 1
          fi
