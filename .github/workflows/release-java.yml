name: Release OMQ.java

on:
  push:
    tags:
      - 'omq-java-v*'
  workflow_dispatch:
    inputs:
      version:
        description: Maven version to publish, for example 0.3.0
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  native:
    name: Native ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-latest
            library: libomq_java.so
          - platform: macos-x86_64
            runner: macos-15-intel
            library: libomq_java.dylib
          - platform: macos-aarch64
            runner: macos-latest
            library: libomq_java.dylib
          - platform: windows-x86_64
            runner: windows-latest
            library: omq_java.dll
    steps:
      - uses: actions/checkout@v7
      - name: Disable local CPU rustflags
        shell: bash
        run: rm -f .cargo/config.toml
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/java/native
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: bindings/java/pom.xml
      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: "3.14"
      - name: install pyzmq
        run: python -m pip install --upgrade pip "pyzmq>=25"
      - name: Build release native
        working-directory: bindings/java/native
        run: cargo build --release --features plain,curve,lz4,zstd
      - name: Compile Java tests
        run: mvn -B -ntp -f bindings/java/pom.xml -DskipNative=true -DskipTests test-compile
      - name: Stage release native for tests
        shell: bash
        run: |
          resource_dir="bindings/java/target/test-classes/io/omq/native/${{ matrix.platform }}"
          mkdir -p "$resource_dir"
          cp "bindings/java/native/target/release/${{ matrix.library }}" "$resource_dir/"
      - name: JUnit with release native
        shell: bash
        env:
          OMQ_INTEROP_REQUIRED: "1"
          OMQ_PYTHON3: ${{ steps.python.outputs.python-path }}
        run: |
          peer_path="${GITHUB_WORKSPACE}/bindings/java/native/target/release/omq-java-peer"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            peer_path="$(pwd -W)/bindings/java/native/target/release/omq-java-peer"
          fi
          mvn -B -ntp -f bindings/java/pom.xml -DskipNative=true \
            "-Domq.java.peer.path=${peer_path}" surefire:test
      - name: Stage native artifact
        shell: bash
        run: |
          resource_dir="native-resource/io/omq/native/${{ matrix.platform }}"
          mkdir -p "$resource_dir"
          cp "bindings/java/native/target/release/${{ matrix.library }}" "$resource_dir/"
      - uses: actions/upload-artifact@v7
        with:
          name: java-native-${{ matrix.platform }}
          path: native-resource

  package:
    name: Package release artifacts
    runs-on: ubuntu-latest
    needs: [native]
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: java-native-*
          merge-multiple: true
          path: bindings/java/target/generated-resources/native
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: bindings/java/pom.xml
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#omq-java-v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Package release artifacts
        run: >
          mvn -B -ntp -f bindings/java/pom.xml -Prelease
          -Drevision=${{ steps.version.outputs.version }}
          -DskipNative=true -DskipTests -Dgpg.skip=true
          package
      - name: Stage smoke artifacts
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          rm -rf java-release-smoke
          mkdir -p java-release-smoke/jars java-release-smoke/test-classes
          cp bindings/java/target/omq-java-"${version}"*.jar java-release-smoke/jars/
          cp -R bindings/java/target/test-classes/io java-release-smoke/test-classes/
      - uses: actions/upload-artifact@v7
        with:
          name: java-release-smoke
          path: java-release-smoke
          retention-days: 7

  classifier-smoke:
    name: Smoke packaged ${{ matrix.platform }} classifier
    runs-on: ${{ matrix.runner }}
    needs: [package]
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-latest
          - platform: macos-x86_64
            runner: macos-15-intel
          - platform: macos-aarch64
            runner: macos-latest
          - platform: windows-x86_64
            runner: windows-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: java-release-smoke
          path: java-release-smoke
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Smoke classifier jar
        shell: bash
        run: |
          version="${{ needs.package.outputs.version }}"
          jar="java-release-smoke/jars/omq-java-${version}-${{ matrix.platform }}.jar"
          test_classes="java-release-smoke/test-classes"
          if [[ ! -f "$jar" ]]; then
            echo "missing classifier jar: $jar" >&2
            exit 1
          fi

          cp_sep=":"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            cp_sep=";"
          fi

          java --enable-native-access=ALL-UNNAMED \
            -cp "${test_classes}${cp_sep}${jar}" \
            io.omq.smoke.PackagingSmoke
          java --enable-native-access=io.omq \
            --module-path "${jar}" --add-modules io.omq \
            -cp "${test_classes}" \
            io.omq.smoke.PackagingSmoke

  publish:
    name: Upload to Maven Central
    runs-on: ubuntu-latest
    needs: [native, classifier-smoke]
    timeout-minutes: 30
    environment:
      name: maven-central
      url: https://central.sonatype.com/artifact/io.github.paddor/omq-java
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: java-native-*
          merge-multiple: true
          path: bindings/java/target/generated-resources/native
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: bindings/java/pom.xml
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#omq-java-v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to Maven Central
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: >
          mvn -B -ntp -f bindings/java/pom.xml -Prelease
          -Drevision=${{ steps.version.outputs.version }}
          -DskipNative=true -DskipTests
          -Dcentral.autoPublish=true -Dcentral.waitUntil=published
          deploy
