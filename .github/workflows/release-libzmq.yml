name: Release omq-libzmq binaries

# Builds libomq_zmq for each platform and attaches it, with zmq.h and
# SHA256SUMS, to an existing omq-libzmq GitHub release. release-plz.yml
# calls this after it releases omq-libzmq; dispatch it to retry or backfill.

on:
  workflow_call:
    inputs:
      tag:
        description: omq-libzmq release tag, for example omq-libzmq-v0.12.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: omq-libzmq release tag, for example omq-libzmq-v0.12.0
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Symbols stay; line tables do not ship.
  CARGO_PROFILE_RELEASE_STRIP: debuginfo

jobs:
  linux:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            image: quay.io/pypa/manylinux_2_28_x86_64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - name: Disable local CPU rustflags
        run: rm -f .cargo/config.toml
      # manylinux_2_28 keeps the glibc requirement at 2.28.
      - name: Build in manylinux
        run: |
          docker run --rm -v "$PWD:/io" -w /io \
            -e CARGO_TERM_COLOR -e RUSTFLAGS -e CARGO_PROFILE_RELEASE_STRIP \
            "${{ matrix.image }}" bash -euo pipefail -c '
              curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
              . "$HOME/.cargo/env"
              cargo build --release -p omq-libzmq
            '
          sudo chown -R "$(id -u):$(id -g)" target
      - name: Stage library
        run: |
          mkdir dist
          cp target/release/libomq_zmq.so "dist/libomq_zmq-${{ matrix.target }}.so"
      - uses: actions/upload-artifact@v7
        with:
          name: libomq-zmq-${{ matrix.target }}
          path: dist

  native:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            library: libomq_zmq.dylib
            asset: libomq_zmq-x86_64-apple-darwin.dylib
          - target: aarch64-apple-darwin
            runner: macos-latest
            library: libomq_zmq.dylib
            asset: libomq_zmq-aarch64-apple-darwin.dylib
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            library: omq_zmq.dll
            asset: omq_zmq-x86_64-pc-windows-msvc.dll
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - name: Disable local CPU rustflags
        shell: bash
        run: rm -f .cargo/config.toml
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Build library
        run: cargo build --release -p omq-libzmq
      - name: Stage library
        shell: bash
        run: |
          mkdir dist
          cp "target/release/${{ matrix.library }}" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v7
        with:
          name: libomq-zmq-${{ matrix.target }}
          path: dist

  publish:
    name: Attach to ${{ inputs.tag }}
    needs: [linux, native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@v7
        with:
          pattern: libomq-zmq-*
          merge-multiple: true
          path: dist
      - name: Add header and checksums
        run: |
          cp omq-libzmq/include/zmq.h dist/zmq.h
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" dist/* --clobber --repo "${{ github.repository }}"
