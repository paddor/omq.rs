name: Release OMQ.node

on:
  push:
    tags:
      - 'omq-node-v*'
  workflow_dispatch:
    inputs:
      version:
        description: npm version to publish, for example 0.1.0
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  native:
    name: Native ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64-gnu
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cross: false
            smoke: true
          - platform: linux-x64-musl
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            cross: true
            smoke: false
          - platform: linux-arm64-gnu
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            cross: false
            smoke: true
          - platform: linux-arm64-musl
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            cross: true
            smoke: false
          - platform: darwin-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            cross: false
            smoke: true
          - platform: darwin-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            cross: false
            smoke: true
          - platform: win32-x64-msvc
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            cross: false
            smoke: true
          - platform: win32-arm64-msvc
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            cross: false
            smoke: true
    steps:
      - uses: actions/checkout@v7
      - name: Disable local CPU rustflags
        shell: bash
        run: rm -f .cargo/config.toml
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: bindings/node/package-lock.json
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/node
      - uses: mlugg/setup-zig@v2
        if: matrix.cross
      - name: Install npm deps
        working-directory: bindings/node
        run: npm ci
      - name: Build TypeScript
        working-directory: bindings/node
        run: npm run build:ts
      - name: Build native addon
        shell: bash
        working-directory: bindings/node
        run: |
          args=(-- --target "${{ matrix.target }}")
          if [[ "${{ matrix.cross }}" == "true" ]]; then
            args+=(--cross-compile)
          fi
          npm run build:native:platform "${args[@]}"
      - name: Test host addon
        if: matrix.smoke
        shell: bash
        working-directory: bindings/node
        run: |
          cp "omq_node.${{ matrix.platform }}.node" omq_node.node
          npm test
          rm -f omq_node.node
      - name: Verify artifact
        shell: bash
        working-directory: bindings/node
        run: test -f "omq_node.${{ matrix.platform }}.node"
      - uses: actions/upload-artifact@v7
        with:
          name: node-native-${{ matrix.platform }}
          path: bindings/node/omq_node.${{ matrix.platform }}.node

  package:
    name: Package npm tarballs
    runs-on: ubuntu-latest
    needs: [native]
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: bindings/node/package-lock.json
      - name: Install npm deps
        working-directory: bindings/node
        run: npm ci
      - name: Build TypeScript
        working-directory: bindings/node
        run: npm run build:ts
      - uses: actions/download-artifact@v7
        with:
          pattern: node-native-*
          merge-multiple: true
          path: bindings/node/artifacts
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#omq-node-v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Stage platform packages
        working-directory: bindings/node
        run: npm run artifacts
      - name: Verify platform artifacts
        shell: bash
        working-directory: bindings/node
        run: |
          for dir in npm/*; do
            platform="${dir#npm/}"
            test -f "$dir/omq_node.$platform.node"
          done
      - name: Prepare package metadata
        working-directory: bindings/node
        run: npm run release:prepare -- ${{ steps.version.outputs.version }}
      - name: Pack tarballs
        shell: bash
        working-directory: bindings/node
        run: |
          mkdir -p release-tarballs
          for dir in npm/*; do
            npm pack "./$dir" --pack-destination release-tarballs
          done
          npm pack . --pack-destination release-tarballs
          ls -l release-tarballs
      - uses: actions/upload-artifact@v7
        with:
          name: node-release-tarballs
          path: bindings/node/release-tarballs/*.tgz
          retention-days: 7

  smoke:
    name: Smoke ${{ matrix.platform }} tarball
    runs-on: ${{ matrix.runner }}
    needs: [package]
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64-gnu
            runner: ubuntu-latest
          - platform: linux-arm64-gnu
            runner: ubuntu-24.04-arm
          - platform: darwin-x64
            runner: macos-15-intel
          - platform: darwin-arm64
            runner: macos-latest
          - platform: win32-x64-msvc
            runner: windows-latest
          - platform: win32-arm64-msvc
            runner: windows-11-arm
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/download-artifact@v7
        with:
          name: node-release-tarballs
          path: dist
      - name: Install packed packages
        shell: bash
        run: |
          mkdir smoke
          cd smoke
          root="../dist/zeromq-omq-node-${{ needs.package.outputs.version }}.tgz"
          platform="../dist/zeromq-omq-node-${{ matrix.platform }}-${{ needs.package.outputs.version }}.tgz"
          test -f "$root"
          test -f "$platform"
          npm install --omit=optional "$platform" "$root"
      - name: Run public API smoke
        shell: bash
        working-directory: smoke
        run: |
          node <<'NODE'
          const { Context, Pull, Push } = require("@zeromq/omq-node");

          (async () => {
            const context = new Context();
            const pull = new Pull({}, context);
            const push = new Push({}, context);
            try {
              const endpoint = await pull.bind("inproc://npm-smoke");
              await push.connect(endpoint);
              await push.send("ok");
              const message = await pull.recv();
              if (message.string() !== "ok") {
                throw new Error(`unexpected payload: ${message.string()}`);
              }
            } finally {
              push.close();
              pull.close();
              context.close();
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [package, smoke]
    timeout-minutes: 15
    environment:
      name: npm
      url: https://www.npmjs.com/package/@zeromq/omq-node
    permissions:
      contents: read
      id-token: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v7
        with:
          name: node-release-tarballs
          path: dist
      - name: Publish platform packages
        shell: bash
        run: |
          root="dist/zeromq-omq-node-${{ needs.package.outputs.version }}.tgz"
          for package in dist/*.tgz; do
            if [[ "$package" == "$root" ]]; then
              continue
            fi
            npm publish "$package" --access public --provenance
          done
      - name: Publish root package
        run: npm publish "dist/zeromq-omq-node-${{ needs.package.outputs.version }}.tgz" --access public --provenance
