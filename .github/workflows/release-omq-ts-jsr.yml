name: Release OMQ.ts JSR

on:
  push:
    branches: [main]
    paths:
      - "pure/typescript/**"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: pure/typescript
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm install
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: deno publish --dry-run
      - run: deno publish
