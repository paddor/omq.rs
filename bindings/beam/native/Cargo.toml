[package]
name = "omq_beam_native"
version = "0.4.0"
edition = "2024"
rust-version = "1.93"
license = "ISC"
authors = ["Patrik Wenger <paddor@gmail.com>"]
repository = "https://github.com/paddor/omq.rs"
description = "BEAM NIF binding for omq.rs."
publish = false

[lib]
name = "omq_beam_native"
crate-type = ["cdylib"]

[features]
default = ["plain", "curve", "lz4", "zstd", "ws", "quic", "webtransport"]
plain = ["omq-tokio/plain"]
curve = ["omq-tokio/curve"]
lz4 = ["omq-tokio/lz4"]
zstd = ["omq-tokio/zstd"]
ws = ["omq-tokio/ws"]
quic = ["omq-tokio/quic"]
webtransport = ["quic", "omq-tokio/webtransport"]

[dependencies]
bytes = "1.12.0"
omq-tokio = { version = "0.39.0", default-features = false }
rustler = "0.38.0"
tokio = { version = "1.52.0", features = ["rt", "sync", "time"] }
