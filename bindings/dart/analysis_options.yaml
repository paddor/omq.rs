include: package:lints/recommended.yaml

analyzer:
  # Built by scripts/update_perf.rb in a scratch package that adds dartzmq.
  exclude:
    - bench/**
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - prefer_final_locals
    - public_member_api_docs
    - unawaited_futures

formatter:
  page_width: 100
