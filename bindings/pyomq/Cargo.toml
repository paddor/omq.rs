[package]
name = "pyomq"
version = "0.26.0"
edition = "2024"
rust-version = "1.93"
license = "ISC"
authors = ["Patrik Wenger <paddor@gmail.com>"]
repository = "https://github.com/paddor/omq.rs"
description = "Python binding for omq.rs - drop-in pyzmq replacement built on omq-tokio."
publish = false

[lib]
name = "pyomq"
crate-type = ["cdylib"]

[features]
default = []
plain = ["omq-tokio/plain"]
curve = ["omq-tokio/curve"]
lz4 = ["omq-tokio/lz4"]
zstd = ["omq-tokio/zstd"]
quic = ["omq-tokio/quic"]
dart = ["omq-tokio/dart"]

[dependencies]
omq-proto = { path = "../../omq-proto", default-features = false }
omq-tokio = { path = "../../omq-tokio", default-features = false }
tokio = { version = "1.53.3", features = ["rt", "rt-multi-thread", "time", "sync", "io-util", "net"] }

bytes = "1.12.1"
libc = "0.2.190"
flume = { version = "0.12", default-features = false, features = ["async", "select"] }
futures = { version = "0.3.34", default-features = false, features = ["std", "async-await"] }
futures-core = { version = "0.3", default-features = false }
yring = { version = "0.3.20", features = ["async"] }

# PyO3 stable ABI: one wheel covers Python 3.12+.
pyo3 = { version = "0.29.3", features = ["abi3-py312", "extension-module"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_System_Threading", "Win32_Security"] }
