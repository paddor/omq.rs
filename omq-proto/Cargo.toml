[package]
name = "omq-proto"
version = "0.29.0"
edition.workspace = true
rust-version.workspace = true
autotests = false
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Sans-I/O ZMTP codec, message types, and routing logic. Backend-agnostic core for omq."
readme = "README.md"
keywords = ["zeromq", "high-performance", "protocol", "codec", "sans-io"]
categories = ["network-programming", "parser-implementations"]

[lints]
workspace = true

[features]
# Minimal default: NULL mechanism + TCP / IPC / inproc / UDP only.
# No C compiler required, no crypto deps. Opt in to features:
#   curve     CURVE encrypted-handshake (RFC 26)
#   lz4       lz4+tcp:// transport (pure Rust; lz4rip)
#   zstd      zstd+tcp:// transport (pure Rust; zrip)
default = []
curve = ["dep:crypto_box", "dep:crypto_secretbox", "dep:subtle", "dep:x25519-dalek", "dep:zeroize"]
plain = []
lz4 = ["dep:lz4rip"]
zstd = ["dep:zrip"]
ws = []
quic = []
dart = []
soak = []

[dependencies]
bytes = "1.12.0"
crypto_box = { version = "0.9", optional = true }
crypto_secretbox = { version = "0.1", optional = true }
subtle = { version = "2.6", optional = true }
x25519-dalek = { version = "3", features = ["static_secrets", "getrandom"], optional = true }
rand = "0.10"
patricia_tree = "0.10"
smallvec = { version = "1", features = ["const_generics", "union"] }
socket2 = { version = "0.6", features = ["all"] }
thiserror = "2.0.18"
zeroize = { version = "1.8.0", features = ["zeroize_derive"], optional = true }

[dependencies.lz4rip]
version = "0.11.9"
default-features = false
features = ["std"]
optional = true

[dependencies.zrip]
version = "0.8.10"
default-features = false
features = ["std", "frame", "dict_builder"]
optional = true

[[bench]]
name = "omq_mechanism_frame"
path = "benches/mechanism_frame.rs"
harness = false
required-features = ["curve"]

[[test]]
name = "omq_proto_connection"
path = "tests/connection.rs"

[[test]]
name = "omq_proto_endpoint"
path = "tests/endpoint.rs"

[[test]]
name = "omq_proto_codec_policy"
path = "tests/codec_policy.rs"

[[test]]
name = "omq_proto_codec_composition"
path = "tests/codec_composition.rs"

[package.metadata.docs.rs]
all-features = true

[target.'cfg(target_pointer_width = "64")'.dev-dependencies]
loom = "0.7"

[target.'cfg(all(loom, target_pointer_width = "64"))'.dependencies]
loom = "0.7"

[[test]]
name = "omq_proto_dart"
path = "tests/dart.rs"
required-features = ["dart"]

[[test]]
name = "omq_proto_loom_dart"
path = "tests/loom_dart.rs"
required-features = ["dart"]
