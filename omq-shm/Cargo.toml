[package]
name = "omq-shm"
version = "0.2.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Linux shared-memory transport for OMQ."
readme = "README.md"
keywords = ["zeromq", "shared-memory", "ipc", "zero-copy", "linux"]
categories = ["network-programming", "os::linux-apis", "memory-management"]

[lints]
workspace = true

[dependencies]
arc-swap = "1.9.2"
bytes = "1.12.1"
concurrent-queue = "2.5.0"
omq-proto = { path = "../omq-proto", version = "0.34.0" }
rand = "0.10.3"
rustix = { version = "1.1", features = ["event", "fs", "mm", "net", "pipe", "process", "thread"] }

[target.'cfg(target_pointer_width = "64")'.dev-dependencies]
loom = "0.7"

[[test]]
name = "omq_shm_loom"
path = "tests/loom.rs"
