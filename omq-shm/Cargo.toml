[package]
name = "omq-shm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Linux shared-memory storage and leases for OMQ."

[lints]
workspace = true

[dependencies]
concurrent-queue = "2.5.0"
omq-proto = { path = "../omq-proto", version = "0.29.0" }
rand = "0.10"
rustix = { version = "1.1", features = ["event", "fs", "mm", "net", "pipe", "process", "thread"] }

[dev-dependencies]
loom = "0.7"

[[test]]
name = "omq_shm_loom"
path = "tests/loom.rs"
