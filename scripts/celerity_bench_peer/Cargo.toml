[workspace]

[package]
name = "celerity_bench_peer"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "celerity_bench_peer"
path = "src/main.rs"

[dependencies]
bytes = "1.5"
celerity = { version = "0.1.1", features = ["tokio"] }
libc = "0.2"
tokio = { version = "1", features = ["rt", "macros", "net", "time"] }

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
