[package]
name = "omq-shm-bench-peer"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[[bin]]
name = "omq_shm_bench_peer"
path = "src/main.rs"

[workspace]

[dependencies]
omq-shm = { path = "../../omq-shm" }
omq-tokio = { path = "../../omq-tokio" }
serde_json = "1"
bytes = "1"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cast_precision_loss = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
