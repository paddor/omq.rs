# Adapted from the published webtrans-proto 0.6.0 manifest.

[package]
name = "omq-webtrans-proto"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT"
repository.workspace = true
description = "WebTransport over HTTP/3 protocol primitives for OMQ, based on webtrans-proto."
readme = "README.md"
keywords = ["network", "webtransport", "http3"]
categories = ["network-programming", "web-programming"]

[features]
fuzzing = []

[dependencies]
bytes = "1.12.1"
http = "1.4.0"
thiserror = "2.0.21"
tokio = { version = "1.53.3", default-features = false, features = ["io-util"] }
url = "2.5.8"
