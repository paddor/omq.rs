# Adapted from the published webtrans-quinn 0.6.0 manifest.

[package]
name = "omq-webtrans-quinn"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT"
repository.workspace = true
description = "WebTransport sessions over Quinn connections for OMQ, based on webtrans-quinn."
readme = "README.md"
keywords = ["network", "webtransport", "quic", "http3"]
categories = ["network-programming", "web-programming"]

[dependencies]
bytes = "1.12.1"
futures = { version = "0.3.34", default-features = false, features = ["std", "async-await"] }
http = "1.4.0"
omq-webtrans-proto = { path = "../omq-webtrans-proto", version = "0.1.0" }
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", default-features = false, features = ["io-util", "macros", "rt", "sync", "time"] }
tracing = "0.1.44"
url = "2.5.8"
